<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雞伴樂活 MVP 展示原型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: three deliverables, each shown at its real size: a phone message, a shareable poster, a one-page report. */
:root{
  color-scheme:light;
  --base:#ffffff; --paper:#ffffff; --soft:#f3f4f3; --ink:#2b2b2b; --sub:#6b6b6b; --line:#dcdcdc; --pine:#2e7d5b;
  --like:#3a9e6f; --great:#d99a2b; --more:#3f6fb5; --chat:#e9eaea; --me:#8de08a; --terra:#c77b4e;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--base);color:var(--ink);line-height:1.6;font-size:17px}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px}
header{padding:20px clamp(16px,4vw,40px) 0;max-width:1080px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand b{font-size:24px;font-weight:700;letter-spacing:1px}
.brand span{display:block;font-size:13.5px;color:var(--sub)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 4px;margin-right:14px;cursor:pointer;color:var(--sub);min-height:44px;font-weight:500}
.tab.on{color:var(--ink);border-bottom-color:var(--pine);font-weight:700}
main{padding:24px clamp(16px,4vw,40px) 16px;max-width:1080px;margin:0 auto}
h1{font-size:26px;font-weight:700;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--sub);margin:0 0 20px;max-width:62ch}
.tag{display:inline-block;font-size:12.5px;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:middle;font-weight:400;background:var(--paper)}
.btn{font-weight:500;border-radius:12px;padding:10px 18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.sel{border-color:var(--pine);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-size:17px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.note{font-size:13px;color:var(--sub);margin:10px 0 0}
.rules{margin:0;padding-left:1.2em}.rules li{margin-bottom:4px}
footer{font-size:12.5px;color:var(--sub);text-align:center;padding:8px 16px 32px}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:.2}to{opacity:1}}

/* phone */
.phone{max-width:372px;margin:0 auto;background:#1c1c1c;border-radius:38px;padding:12px}
.pscr{border-radius:28px;overflow:hidden;background:var(--chat)}
.lhead{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.lhead b{font-size:16px}
.lhead small{display:block;font-size:11px;color:var(--sub);font-weight:400}
.lbody{padding:12px 10px;display:flex;flex-direction:column;gap:10px;min-height:320px}
.day{align-self:center;font-size:12px;color:var(--sub);background:#fff;border-radius:999px;padding:1px 12px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.ava{width:34px;height:34px;border-radius:50%;background:#fff;flex:none;overflow:hidden}
.ava img,.ava svg{width:100%;height:100%;object-fit:cover;display:block}
.who{font-size:12px;color:var(--sub);margin-bottom:2px}
.bub{background:#fff;border-radius:4px 18px 18px 18px;padding:10px 12px;font-size:16px}
.mine{align-self:flex-end}
.mine .bub{background:var(--me);border-radius:18px 4px 18px 18px;font-weight:700}
.cardmsg{background:#fff;border-radius:16px;overflow:hidden;width:100%}
.cardmsg .in{padding:10px 12px}
.cardmsg h3{margin:0 0 4px;font-size:17px}
.cardmsg p{margin:0;font-size:16px}
.cardmsg .q{margin-top:8px;font-weight:700}
.pic{margin:0}
.pic .ph,.pic img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.pic .ph{display:flex;align-items:center;justify-content:center;text-align:center;background:#e6e9e7;color:var(--sub);font-size:18px;font-weight:500;border:2px dashed #b9beba}
.pic .ph small{font-size:13px;font-weight:400}
.voices{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.vbtn.on{border-color:var(--pine);color:var(--pine)}
.reacts{display:grid;gap:12px;padding:4px 12px 14px}
.react{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;border-radius:14px;padding:14px 16px;cursor:pointer;min-height:66px;font-size:24px;font-weight:700}
.react.like{background:var(--like);color:#fff}.react.great{background:var(--great);color:var(--ink)}.react.more{background:var(--more);color:#fff}
.react span{font-size:26px}
.replied{margin:4px 12px 14px;padding:12px;border-radius:12px;background:#eeeeee;color:var(--sub);text-align:center;font-weight:500}
.buylink{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:12px 14px;cursor:pointer;font-size:15px}
.buylink b{display:block;font-size:16px;color:var(--pine)}

/* poster */
.poster{max-width:400px;margin:0 auto;background:#fffdf7;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.poster .top{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.poster .wk{padding:14px 18px 16px}
.poster .wk b{display:block;font-size:15px;color:var(--pine);margin-bottom:4px}
.poster .wk p{margin:0;font-size:19px;font-weight:500;line-height:1.55}
.poster .hero{background:var(--pine);color:#fff;padding:16px 20px 14px;text-align:center}
.poster .hero b{display:block;font-size:24px;line-height:1.3}
.poster .hero span{display:block;font-size:14px;margin-top:6px;opacity:.92}
.poster .story{padding:12px 18px 0;font-size:14.5px;color:var(--sub);text-align:center}
.prod{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid #eee5d3}
.prod img{width:96px;height:76px;object-fit:cover;border-radius:10px;display:block}
.prod b{display:block;font-size:17px;line-height:1.3}
.prod small{color:var(--sub);font-size:13px}
.prod .price{font-size:22px;font-weight:700;color:var(--pine);white-space:nowrap}
.deal{margin:14px 18px 0;background:#fdf1d6;border-radius:14px;padding:12px;text-align:center}
.deal b{display:block;font-size:21px}
.deal span{font-size:13.5px;color:#6f4c00}
.cta{display:block;margin:14px 18px 6px;background:var(--pine);color:#fff;border-radius:14px;padding:14px;text-align:center;font-size:20px;font-weight:700}
.poster .fine{font-size:11.5px;color:var(--sub);text-align:center;padding:4px 18px 14px}
.step{display:inline-flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;cursor:pointer}
.step b{min-width:24px;text-align:center;font-size:19px}
.orow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{height:14px;border-radius:999px;background:#e3e6e4;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--pine)}

/* LINE menu */
.rmenu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));aspect-ratio:2500/1686;container-type:inline-size;background:#fff}
.rt{position:relative;border:0;padding:0;margin:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqw;background:#fff;color:var(--ink);outline:1px solid #e3e3e3;overflow:hidden;font-family:inherit}
.rt b{font-size:5.6cqw;font-weight:700;line-height:1.2;position:relative}
.rt svg{width:11cqw;height:11cqw;color:var(--pine);position:relative}
.rt.ph{color:#fff;justify-content:flex-end;padding-bottom:3.5cqw}
.rt.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rt.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.72))}
.rt.ph b{z-index:1}
.rt.pine{background:var(--pine);color:#fff}.rt.pine svg{color:#fff}
/* report */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:4px;max-width:780px;margin:0 auto;padding:clamp(20px,4vw,44px)}
.doc .hd{border-bottom:2px solid var(--terra);padding-bottom:12px;margin-bottom:18px}
.doc .hd b{font-size:23px;line-height:1.35;display:block}
.doc .hd span{display:block;color:var(--sub);font-size:14.5px}
.kbig{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,8fr);gap:28px;align-items:end;margin-bottom:24px}
.kpi b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--sub)}
.kpi.lead b{font-size:92px;line-height:1;color:var(--pine)}
.kpi.lead span{font-size:17px;color:var(--ink);font-weight:500}
.kside{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,4fr) minmax(0,5fr);gap:14px}
.kside .kpi b{font-size:25px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:6px 0 22px}
.doc h2{font-size:16px;margin:0 0 4px}
.err{background:#fdecea;padding:16px;border-radius:12px}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:760px){.grid2,.kbig{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><b>雞伴樂活</b><span id="sub"></span></div>
    <button class="btn" data-act="lang" id="langBtn"></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Screens"></nav>
</header>
<main><div id="stage"></div></main>
<footer id="foot"></footer>

function render(){
  $("sub").textContent=L("母雞故事、LINE 團購與 ESG 月報．MVP 展示原型（草稿）","Hen stories, LINE group-buy and ESG report · MVP demo (draft)");
  $("langBtn").textContent=L("English","中文");
  $("tabs").innerHTML=tabs.map(function(t,i){return '<button class="tab'+(i===st.tab?" on":"")+'" data-act="tab" data-v="'+i+'"'+(i===st.tab?' aria-current="page"':"")+">"+L(t.z,t.e)+"</button>"}).join("");
  try{$("stage").innerHTML=views[tabs[st.tab].k]()}catch(e){$("stage").innerHTML='<div class="err" id="renderError">'+String(e)+"</div>"}
  $("foot").textContent=L("草稿示範．所有數字皆為範例資料．故事與語音為範例","Draft demo. All figures are sample data. Stories and voice are samples.");
  document.documentElement.lang=L("zh-Hant","en");
}
function stopVoice(){st.speaking="";try{window.speechSynthesis.cancel()}catch(e){}}
function voice(v){
  if(st.speaking===v){stopVoice();render();return}
  stopVoice();
  if(v==="tw"){st.speaking="tw";render();setTimeout(function(){if(st.speaking==="tw"){st.speaking="";render()}},2500);return}
  try{
    if(!("speechSynthesis" in window))throw 0;
    var u=new SpeechSynthesisUtterance(story.z.join(""));u.lang="zh-TW";u.rate=.85;
    u.onend=u.onerror=function(){st.speaking="";render()};
    window.speechSynthesis.speak(u);st.speaking="zh";render();
  }catch(e){render()}
}
function savePhotos(){try{localStorage.setItem("henPhotos2",JSON.stringify(st.photos))}catch(e){}}
function go(i){stopVoice();st.tab=i;try{history.replaceState(null,"","#"+tabs[i].k)}catch(e){}render();try{window.scrollTo(0,0)}catch(e){}}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,v=b.dataset.v;
  if(a==="tab")go(+v);
  else if(a==="lang"){stopVoice();st.lang=st.lang==="zh"?"en":"zh";render()}
  else if(a==="voice")voice(v);
  else if(a==="react"){st.react=v;render()}
  else if(a==="again"){st.react="";render()}
  else if(a==="qty"){var q=v.split(",");st.qty[q[0]]=Math.max(0,Math.min(9,st.qty[q[0]]+(+q[1])));st.ordered=false;render()}
  else if(a==="order"){if(total()>=500){st.ordered=true;render()}}
  else if(a==="nophoto"){delete st.photos[0];savePhotos();render()}
});
document.addEventListener("change",function(ev){
  if(ev.target.id==="photoIn"&&ev.target.files&&ev.target.files[0]){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      st.photos[0]=c.toDataURL("image/jpeg",.85);savePhotos();render();
    };im.src=r.result};
    r.readAsDataURL(ev.target.files[0]);
  }
});
function fromHash(){var k=(location.hash||"").slice(1),i=tabs.map(function(t){return t.k}).indexOf(k);if(i>=0&&i!==st.tab){st.tab=i;render()}}
window.addEventListener("hashchange",fromHash);
try{var saved=JSON.parse(localStorage.getItem("henPhotos2")||"{}");if(saved&&typeof saved==="object")st.photos=saved}catch(e){}
(function(){var k=(location.hash||"").slice(1),i=tabs.map(function(t){return t.k}).indexOf(k);if(i>=0)st.tab=i})();
render();
</script>
